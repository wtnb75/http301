name: update-deps

on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-deps:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: wtnb75/actions/golang@v1
    - uses: wtnb75/actions/goupdate@v1
      with:
        go-test-args: "-v ./..."
